<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newshub</title>
    <meta name="description" content="주요 포털 뉴스를 한눈에 확인하세요.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css?v=4.1.0">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="main-header glass-header">
            <div class="header-content">
                <div class="logo">
                    <i data-lucide="compass" class="logo-icon"></i>
                    <span>News<span>Hub</span></span>
                </div>
                <div class="header-actions" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center;">
                    <button id="search-btn" class="header-btn" aria-label="검색" style="background: transparent; border: none; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; outline: none; border-radius: 50%;">
                        <i data-lucide="search" style="width: 20px; height: 20px; display: block;"></i>
                    </button>
                </div>
            </div>
            <!-- Search Bar Container -->
            <div class="search-bar-container" id="search-bar-container" style="display: none;">
                <div class="search-input-wrapper">
                    <i data-lucide="search" class="search-input-icon"></i>
                    <input type="text" id="search-input" placeholder="기사 제목을 검색해 보세요..." autocomplete="off">
                    <button id="search-clear-btn" class="search-clear-btn" style="display: none;">
                        <i data-lucide="x"></i>
                    </button>
                </div>
            </div>
            <!-- Category Tabs -->
            <nav class="category-tabs" id="category-tabs">
                <!-- Injected via JS -->
            </nav>
            <!-- Subcategory Tabs -->
            <nav class="subcategory-tabs" id="subcategory-tabs" style="display: none;">
                <!-- Injected via JS -->
            </nav>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-area">
                <!-- Posts Grid -->
                <div id="posts-list" class="posts-list-container">
                    <!-- Posts will be injected here -->
                    <div class="loading-shimmer">
                        <div class="shimmer-item"></div>
                        <div class="shimmer-item"></div>
                        <div class="shimmer-item"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer / Mobile Nav -->
        <footer class="main-footer">
            <p>&copy; 2026 Newshub. Real-time News Aggregator.</p>
        </footer>
    </div>

    <script src="data.js?v=4.1.0"></script>
    <script src="app.js?v=4.1.0"></script>
</body>
</html>
