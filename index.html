<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Issue</title>
    <meta name="description" content="주요 커뮤니티의 실시간 베스트 글을 광고 없이 한눈에 확인하세요.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="main-header">
            <div class="header-content">
                <div class="logo">
                    <i data-lucide="calendar" class="logo-icon"></i>
                    <span>Daily<span>issue</span></span>
                </div>
                <div class="header-meta">
                    <span id="update-timer" class="update-timer">
                        <i data-lucide="refresh-cw" class="spin-icon" id="sync-icon"></i>
                        <span id="last-update-text">갱신하기</span>
                    </span>
                </div>
            </div>
            
            <!-- Site Tabs -->
            <nav class="community-tabs" id="community-tabs">
                <button class="tab-btn active" data-community="all">전체</button>
                <button class="tab-btn" data-community="Ruliweb">루리웹</button>
                <button class="tab-btn" data-community="Theqoo">더쿠</button>
                <button class="tab-btn" data-community="Bobae Dream">보배</button>
                <button class="tab-btn" data-community="Clien">클리앙</button>
                <button class="tab-btn" data-community="Ppomppu">뽐뿌</button>
                <button class="tab-btn" data-community="DC Inside">디시</button>
                <button class="tab-btn" data-community="MLB Park">엠팍</button>
                <button class="tab-btn" data-community="Instiz">인티</button>
                <button class="tab-btn" data-community="Inven">인벤</button>
                <button class="tab-btn" data-community="HumorUniv">웃대</button>
                <button class="tab-btn" data-community="TodayHumor">오유</button>
                <button class="tab-btn" data-community="Wygosu">와고</button>
                <button class="tab-btn" data-community="82Cook">82쿡</button>
                <button class="tab-btn" data-community="Etoland">이토</button>
                <button class="tab-btn" data-community="Reddit">레딧</button>
                <button class="tab-btn" data-community="Naver News">네이버</button>
                <button class="tab-btn" data-community="Daum News">다음</button>
                <button class="tab-btn" data-community="Nate News">네이트</button>
                <button class="tab-btn" data-community="Yahoo US">야후 US</button>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="content-area">
            <!-- Google Search Container (Desktop Only) -->
            <div class="portal-search-container">
                <div class="portal-logo-wrapper">
                    <i data-lucide="calendar" class="portal-logo-icon"></i>
                    <span>Daily<span>issue</span></span>
                </div>
                <div class="portal-search-box">
                    <i data-lucide="search"></i>
                    <input type="text" id="portal-search-input" placeholder="Google 검색...">
                    <button class="portal-search-btn" id="portal-search-submit">검색</button>
                </div>
            </div>

            <!-- Portal Columns Wrapper -->
            <div class="portal-wrapper">
                <!-- Left Column -->
                <div class="portal-left">
                    <!-- Naver style Community Grid (Desktop Only) -->
                    <div class="community-grid-container">
                        <div class="grid-header">
                            <div class="grid-tabs" style="font-weight: 700; font-size: 0.85rem; color: var(--text-primary);">
                                전체 채널 리스트
                            </div>
                            <div class="grid-meta-info">
                                <i data-lucide="info" style="width:12px;height:12px;"></i>
                                <span>아이콘 클릭 시 실시간 필터링 적용</span>
                            </div>
                        </div>
                        <div class="community-grid" id="community-grid">
                            <!-- Injected dynamically by JS -->
                        </div>
                    </div>

                    <!-- Mobile search bar -->
                    <div class="search-bar">
                        <i data-lucide="search"></i>
                        <input type="text" id="post-search" placeholder="제목이나 커뮤니티 검색...">
                    </div>

                    <!-- View Mode Switcher -->
                    <div class="view-mode-container" id="view-mode-container" style="display: none;">
                        <div class="view-mode-title" id="view-mode-title-text">모아보기 피드</div>
                        <div class="view-mode-switch">
                            <button class="view-mode-btn" id="view-mode-timeline" title="시간순 타임라인">
                                <i data-lucide="list"></i>
                                <span>타임라인</span>
                            </button>
                            <button class="view-mode-btn active" id="view-mode-dashboard" title="사이트별 모아보기">
                                <i data-lucide="layout-grid"></i>
                                <span>모아보기</span>
                            </button>
                        </div>
                    </div>

                    <!-- Posts list -->
                    <div id="posts-list" class="posts-list">
                        <!-- Posts will be injected here -->
                        <div class="loading-shimmer">
                            <div class="shimmer-item"></div>
                            <div class="shimmer-item"></div>
                            <div class="shimmer-item"></div>
                        </div>
                    </div>
                </div>

                <!-- Right Column (Desktop Only Sidebar) -->
                <aside class="portal-sidebar">
                    <!-- Mock Login Box -->
                    <div class="login-card">
                        <p class="login-message">
                            <strong>Daily<span>issue</span></strong>를 더 쉽고 편리하게 이용하세요. 광고 없는 실시간 베스트 모아보기 서비스입니다.
                        </p>
                        <a href="#" class="portal-login-btn" onclick="alert('모의 로그인 기능입니다. 실제 로그인이 필요 없는 서비스입니다!'); return false;">
                            <i data-lucide="user"></i>
                            <span>Dailyissue 로그인</span>
                        </a>
                        <div class="login-links">
                            <a href="#" onclick="alert('모의 링크입니다.'); return false;">아이디 찾기</a>
                            <span>|</span>
                            <a href="#" onclick="alert('모의 링크입니다.'); return false;">비밀번호 찾기</a>
                            <span>|</span>
                            <a href="#" onclick="alert('회원가입은 준비 중입니다.'); return false;">회원가입</a>
                        </div>
                    </div>

                    <!-- Stats & Time Box -->
                    <div class="info-card">
                        <div class="info-card-header">
                            <span>실시간 브리핑</span>
                            <span style="color:var(--accent-color); font-weight:700;">LIVE</span>
                        </div>
                        <div class="portal-clock" id="portal-clock">00:00:00</div>
                        <div class="portal-stats-row">
                            <span>실시간 수집 커뮤니티</span>
                            <span id="stats-active-communities">12개</span>
                        </div>
                        <div class="portal-stats-row">
                            <span>오늘의 총 베스트 글</span>
                            <span id="stats-total-posts">0개</span>
                        </div>
                    </div>
                </aside>
            </div>
        </main>

        <!-- Footer / Mobile Nav -->
        <footer class="main-footer">
            <p>&copy; 2026 Dailyissue. Ad-free Community Aggregator.</p>
        </footer>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
