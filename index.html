<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newshub</title>
    <meta name="description" content="주요 포털 뉴스를 한눈에 확인하세요.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css?v=4.1.0">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="main-header glass-header">
            <div class="header-content">
                <div class="logo">
                    <i data-lucide="compass" class="logo-icon"></i>
                    <span>News<span>Hub</span></span>
                </div>
            </div>
            <!-- Category Tabs -->
            <nav class="category-tabs" id="category-tabs">
                <!-- Injected via JS -->
            </nav>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-area">
                <!-- Posts Grid -->
                <div id="posts-list" class="posts-list-container">
                    <!-- Posts will be injected here -->
                    <div class="loading-shimmer">
                        <div class="shimmer-item"></div>
                        <div class="shimmer-item"></div>
                        <div class="shimmer-item"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer / Mobile Nav -->
        <footer class="main-footer">
            <p>&copy; 2026 Newshub. Real-time News Aggregator.</p>
        </footer>
    </div>

    <script src="data.js?v=4.1.0"></script>
    <script src="app.js?v=4.1.0"></script>
</body>
</html>
