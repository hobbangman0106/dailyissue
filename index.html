<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Issue</title>
    <meta name="description" content="주요 커뮤니티의 실시간 베스트 글을 한눈에 확인하세요.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css?v=1.1.22">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="main-header">
            <div class="header-content">
                <div class="logo">
                    <i data-lucide="calendar" class="logo-icon"></i>
                    <span>Daily<span>issue</span></span>
                </div>

            </div>
            

            
            <!-- Economic News Ticker -->
            <div class="ticker-board news-ticker" id="news-ticker">
                <!-- Injected via JS -->
            </div>
        </header>

        <!-- Main Content -->
        <main class="content-area">
            <!-- Portal Columns Wrapper -->
            <div class="portal-wrapper">
                <!-- Left Column -->
                <div class="portal-left">





                    <!-- Posts list -->
                    <div id="posts-list" class="posts-list">
                        <!-- Posts will be injected here -->
                        <div class="loading-shimmer">
                            <div class="shimmer-item"></div>
                            <div class="shimmer-item"></div>
                            <div class="shimmer-item"></div>
                        </div>
                    </div>
                </div>


            </div>
        </main>

        <!-- Footer / Mobile Nav -->
        <footer class="main-footer">
            <p>&copy; 2026 Dailyissue. Real-time Community Aggregator.</p>
        </footer>
    </div>

    <script src="data.js?v=1.1.22"></script>
    <script src="app.js?v=1.1.22"></script>
</body>
</html>
