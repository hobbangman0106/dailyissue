name: Scheduled Community Update

on:
  schedule:
    - cron: '21 * * * *' # At minute 21 of every hour
  workflow_dispatch: # Allow manual run

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Random Delay
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 45))
          echo "Delaying execution by $DELAY seconds..."
          sleep $DELAY

      - name: Run Scraper
        run: npm run scrape

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json data.js
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update community data"
          git pull --rebase origin main
          git push origin main
